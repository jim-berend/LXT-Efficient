[project]
name = "lxt-efficient"
version = "2.1.0"
description = "Fork of LRP-eXplains-Transformers (LXT): the transformers-independent efficient core only."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["torch"]

[project.optional-dependencies]
zennit = ["zennit"]

[project.urls]
upstream = "https://github.com/rachtibat/LRP-eXplains-Transformers"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lxt"]
